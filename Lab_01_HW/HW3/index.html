<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resilient Landing Page</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>Resilient Event Hub</h1>
    </header>

    <main>
        <section aria-labelledby="countdown-title">
            <h2 id="countdown-title">Event Countdown</h2>

            <p id="countdown">
                Loading countdown...
            </p>
        </section>
        <section aria-labelledby="registration-title">
            <h2 id="registration-title">Event Registration</h2>

            <form id="registration-form">
                <p>
                    <label for="name">Name</label>
                    <input type="text" id="name" name="name" required>
                </p>

                <p>
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" required>
                </p>

                <button type="submit" id="submit-button">
                    Register
                </button>

                <p id="form-status" aria-live="polite">
                    Ready to submit.
                </p>
            </form>
        </section>
    </main>

    <script src="script.js"></script>
</body>

</html>
